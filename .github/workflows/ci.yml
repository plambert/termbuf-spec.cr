name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The specs, on both operating systems the library is published for. The
  # emulator is the same on each, but the library is a different file, and the
  # bindings read struct layouts out of whichever one is linked.
  spec:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, macos-14]

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      # A fork of mlugg/setup-zig with one line changed, so that the
      # action runs on node 24. Upstream still declares node 20, has no
      # release that does not, and has issues and pull requests disabled.
      # Pinned by commit rather than by tag.
      - uses: plambert/setup-zig@d4e0a4ca2bd2d3ec3323a22917f3abe38807a292 # v2.2.1-node24
        with:
          version: 0.16.0

      # The library is not cached between runs. The script downloads the
      # published build for the pinned commit, which takes a second or two,
      # and a run that starts empty is the same thing a consumer does on a
      # first install. Caching it hid that path, and carried one runner's
      # build onto a runner with a different processor.

      - run: shards install

      # `make check` builds libghostty-vt first, then runs the format check and
      # the specs. `shards install` does not build it, because a postinstall
      # script runs for a dependency and not for the shard being installed.
      - run: make check

  # ameba reads the source rather than running it, so one platform answers for
  # both, and none of the rest of the build is needed here.
  #
  # The action runs ameba from a prebuilt container, so nothing is compiled.
  # Its 1.0.0 is built on ameba's `latest` image, which is 1.7.0 today and
  # will be whatever ameba releases next. `make lint` names a version, so the
  # two can disagree after an ameba release.
  #
  # Findings are reported on the lines they are about rather than in the log.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: crystal-ameba/github-action@v1.0.0
