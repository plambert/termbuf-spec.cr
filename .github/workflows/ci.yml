name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The machine cache that the build script keeps its library in, keyed on
      # the pinned commit. A hit means the script does nothing at all. A miss
      # means it downloads the published build, and falls back to compiling
      # ghostty only when there is not one.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/termbuf-spec
          key: libghostty-vt-${{ runner.os }}-${{ hashFiles('vendor/ghostty.pin') }}

      - run: shards install

      # `make check` builds libghostty-vt first, then runs the format check and
      # the specs. `shards install` does not build it, because a postinstall
      # script runs for a dependency and not for the shard being installed.
      - run: make check
