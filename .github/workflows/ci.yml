name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The built library, keyed on the pinned commit. A hit skips the fetch
      # and the build entirely, because the script stops as soon as it sees a
      # library built from the commit the pin names.
      - uses: actions/cache@v4
        with:
          path: vendor/build
          key: libghostty-vt-${{ runner.os }}-${{ hashFiles('vendor/ghostty.pin') }}

      - run: shards install

      - run: crystal tool format --check src spec

      - run: crystal spec
