name: termbuf-spec
version: 0.6.0

authors:
  - Paul M. Lambert <plambert@plambert.net>

crystal: '>= 1.21.0'

license: MIT

description: |
  A test harness for TermBuf applications. Runs an application against a real
  terminal emulator - Ghostty's, embedded as libghostty-vt - held entirely in
  memory, so a spec can draw widgets, type raw bytes at them, and assert on the
  cells that came out the other side.

# The harness drives a Termbuf::Terminal, so termbuf and its input side are
# needed to build one. Widgets are not: an application that uses them brings
# them itself, and the widget helpers here compile against whatever it has.
dependencies:
  termbuf:
    github: plambert/termbuf.cr
    version: "~> 0.8"
  termbuf-input:
    github: plambert/termbuf-input.cr
    version: "~> 0.6"

development_dependencies:
  termbuf-widgets:
    github: plambert/termbuf-widgets.cr
    version: "~> 0.7"
  spectator:
    gitlab: arctic-fox/spectator
    version: "~> 0.11"

# libghostty-vt comes from the commit named in vendor/ghostty.pin: a published
# build is downloaded where there is one for this platform, and otherwise it is
# built from source, which needs git and zig 0.16.0 or newer in PATH. Either way
# it happens once per machine; afterwards the script finds it in the cache and
# stops.
#
# This runs for a project that depends on this shard. It does not run in a clone
# of this shard, because shards runs a postinstall for a shard it installs as a
# dependency and never for the root shard. A contributor runs `make lib` once
# instead, which is what `make check` and `make spec` depend on.
scripts:
  postinstall: ./scripts/build-libghostty-vt.sh
